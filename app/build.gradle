plugins { id 'com.android.application' }
def ludilSigningStore = System.getenv('LUDIL_SIGNING_STORE') ?: System.getenv('LODIL_SIGNING_STORE')
def ludilSigningPassword = System.getenv('LUDIL_SIGNING_PASSWORD') ?: System.getenv('LODIL_SIGNING_PASSWORD')
def ludilSigningAlias = System.getenv('LUDIL_SIGNING_ALIAS') ?: System.getenv('LODIL_SIGNING_ALIAS') ?: 'lodil'
android {
    namespace 'app.ludil'
    compileSdk 35
    buildToolsVersion '35.0.0'
    androidResources { noCompress += ['onnx','bin']; ignoreAssetsPattern = '.*' }
    defaultConfig {
        applicationId 'app.lodil'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (ludilSigningStore) {
                storeFile file(ludilSigningStore)
                storePassword ludilSigningPassword
                keyAlias ludilSigningAlias
                keyPassword ludilSigningPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ludilSigningStore) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetTextI18n', 'HardcodedText' }
}
dependencies {
    implementation files('libs/tesseract4android-4.9.0.aar', 'libs/onnxruntime-android-1.22.0.aar')
    implementation 'androidx.annotation:annotation:1.9.1'
}
