plugins { id 'com.android.application' }
android {
    namespace 'app.lodil'
    compileSdk 35
    buildToolsVersion '35.0.0'
    androidResources { noCompress += ['onnx','bin']; ignoreAssetsPattern = '.*' }
    defaultConfig {
        applicationId 'app.lodil'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (System.getenv('LODIL_SIGNING_STORE')) {
                storeFile file(System.getenv('LODIL_SIGNING_STORE'))
                storePassword System.getenv('LODIL_SIGNING_PASSWORD')
                keyAlias System.getenv('LODIL_SIGNING_ALIAS') ?: 'lodil'
                keyPassword System.getenv('LODIL_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LODIL_SIGNING_STORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetTextI18n', 'HardcodedText' }
}
dependencies {
    implementation files('libs/tesseract4android-4.9.0.aar', 'libs/onnxruntime-android-1.22.0.aar')
    implementation 'androidx.annotation:annotation:1.9.1'
}
